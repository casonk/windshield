name: CI

on: [push, pull_request, workflow_dispatch]

jobs:
  # Does the installed distribution work, on each OS we claim to support?
  # python-ci below imports the source tree on ubuntu; this installs the package
  # and imports it from a neutral cwd, which is the only way to distinguish a
  # working install from a source tree that happens to be present.
  install-check:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    uses: casonk/.github/.github/workflows/install-check.yml@main
    with:
      # The declared requires-python floor and the newest supported CPython, resolved by the
      # shared workflow so this file never needs a Python version bump.
      python-versions: auto-edges
      # dev only, deliberately. Every browser backend here is an optional extra,
      # and installing them would spend runner time downloading Playwright and
      # Selenium to prove something this job is not asking. What is being
      # checked is that the package installs and imports on each platform.
      install-extra: dev

  ci:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    uses: casonk/.github/.github/workflows/python-ci.yml@main
    with:
      # The newest three supported CPython releases (within requires-python).
      python-versions: auto
      coverage: true
      coverage-source: windshield
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
